name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Buat folder android
        run: |
          flutter create --platforms=android --project-name wa_ios app_tmp
          cp -r app_tmp/android ./android
          rm -rf app_tmp

      - name: Izin internet dan nama aplikasi
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $M
          sed -i 's#android:label="wa_ios"#android:label="WhatsApp iOS"#' $M
          grep -n "INTERNET" $M

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: wa-ios-apk
          path: build/app/outputs/flutter-apk/app-release.apk
